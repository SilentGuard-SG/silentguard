[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silentguard-prefill"
version = "0.1.0"
description = "Prefill-time prompt injection filtering with an auditable payment-agent demo"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{name = "SilentGuard contributors"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
runtime = ["torch==2.13.0", "transformers==4.57.1", "safetensors>=0.5,<1"]
demo = ["torch==2.13.0", "transformers==4.57.1", "safetensors>=0.5,<1", "fastapi==0.141.1", "uvicorn==0.42.0"]
test = ["pytest>=8,<10", "httpx==0.28.1", "fastapi==0.141.1", "uvicorn==0.42.0"]

[project.scripts]
sg-demo = "sg_guard.demo.server:main"

[project.urls]
Repository = "https://github.com/SilentGuard-SG/silentguard"
Issues = "https://github.com/SilentGuard-SG/silentguard/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sg_guard = ["assets/*.json", "assets/*.npz", "assets/*.jinja", "assets/*.txt"]
"sg_guard.demo" = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
